syntax = "proto3";
package gamepb.activitypb;
import "item.proto";

message ActivityHead {
    int64 id = 1;
    int64 group_id = 2;
    int64 type = 3;
    string name = 4;
    string desc = 5;
    int64 start_time = 6;
    int64 end_time = 7;
    int64 client_id = 8;
    int64 status = 20;
    int64 splash_order = 21;
    bool splashed = 22;
    bool has_red_dot = 23;
}

message ActivityBodyShop {
    repeated ShopGoodsInfo goods = 1;
}

message ShopGoodsInfo {
    int64 id = 1;
    repeated ShopItemInfo item = 2;
    repeated ShopItemInfo cost = 3;
    int64 purchase_limit = 4;
    int64 purchased_count = 5;
    int64 order = 6;
    string name = 7;
    string desc = 8;
    int64 diamond_cost_count = 9;
    int64 background_type = 10;
    int64 restriction_type = 11;
}

message ShopItemInfo {
    int64 id = 1;
    int64 count = 2;
}

message ShopBuyReq {
    int64 goods_id = 1;
    int64 count = 2;
}

message ShopBuyRsp {
    repeated corepb.Item awards = 1;
    repeated corepb.Item costs = 2;
}

message ActivityBodyMilkTea {
    MilkTeaSummary summary = 1;
}

message MilkTeaSummary {
    int64 shop_open_at = 1;
    string shop_name = 2;
    int64 level = 4;
    int64 total_revenue = 5;
    int64 next_cup_at = 16;
}

message MilkTeaEmptyReq {}

message MilkTeaShopViewRsp {
    MilkTeaShopView view = 1;
}

message MilkTeaShopView {
    int64 level = 1;
    int64 total_revenue = 2;
    int64 next_level_revenue = 3;
    int64 cashier_capacity_sec = 4;
    int64 cashier_elapsed_sec = 5;
    repeated MilkTeaEmployee employees = 9;
    int64 projection_ver = 11;
    int64 next_full_at = 14;
    int64 sales_item_id = 15;
    int64 sales_duration_sec = 16;
    repeated corepb.Item pending_rewards = 19;
    map<int32, int64> pending_cups_by_recipe = 20;
    map<int32, int64> pending_cups_by_source = 21;
    int64 boost_cups_per_use = 22;
    repeated corepb.Item boost_preview_rewards = 23;
    int64 effective_cups_per_hour = 24;
    map<int32, int64> boost_coin_price = 25;
}

message MilkTeaRecipesRsp {
    repeated MilkTeaRecipe recipes = 1;
}

message MilkTeaRecipe {
    int64 recipe_id = 1;
    string recipe_name = 2;
    bool unlocked = 3;
    bool is_advanced = 4;
    int64 token_price = 5;
    int64 coin_price = 6;
    int64 stock_cups = 7;
}

message MilkTeaClaimRsp {
    repeated corepb.Item awards = 1;
}

message MilkTeaMakeReq {
    repeated int64 item_uids = 1 [packed = true];
}

message MilkTeaRecipeCup {
    int64 recipe_id = 1;
    int64 count = 2;
}

message MilkTeaMakeRsp {
    repeated MilkTeaRecipeCup made_cups = 1;
    repeated MilkTeaRecipeCup listed_cups = 2;
    repeated corepb.Item used_fruits = 3;
}

message MilkTeaFriend {
    int64 gid = 1;
    string nickname = 2;
    string avatar = 3;
    int64 level = 4;
}

message MilkTeaHireCandidate {
    MilkTeaFriend user = 1;
    int64 candidate_type = 2;
    int64 specialty_id = 3;
    string specialty_name = 4;
}

message MilkTeaHireListReq {
    int64 duration_id = 1;
}

message MilkTeaHireListRsp {
    int64 shift_index = 1;
    int64 shift_cost = 2;
    int64 unknown_3 = 3;
    repeated MilkTeaHireCandidate friends = 4;
    repeated MilkTeaHireCandidate trainees = 5;
}

message MilkTeaHireSelection {
    int64 candidate_type = 1;
    int64 duration_id = 2;
    int64 friend_gid = 3;
}

message MilkTeaHireReq {
    MilkTeaHireSelection selection = 1;
}

message MilkTeaEmployee {
    int64 uid = 3;
    int64 start_at = 4;
    int64 end_at = 5;
    int64 cost = 6;
    int64 specialty_id = 7;
    string specialty_name = 8;
    MilkTeaFriend user = 11;
}

message MilkTeaHireResult {
    int64 candidate_type = 1;
    int64 duration_id = 2;
    int64 friend_gid = 3;
    int64 status = 4; 
    MilkTeaEmployee employee = 5;
}

message MilkTeaHireRsp {
    MilkTeaHireResult result = 1;
}

message MilkTeaRankEntry {
    MilkTeaFriend user = 1;
    string shop_name = 2;
    int64 shop_level = 3;
    int64 total_revenue = 4;
    int64 rank = 5;
}

message MilkTeaRankingRsp {
    repeated MilkTeaRankEntry entries = 1;
    int64 total = 2;
    int64 updated_at = 3;
    int64 page = 4;
    int64 has_more = 5;
}

message MilkTeaCupCount {
    int64 recipe_id = 1;
    int64 count = 2;
}

message MilkTeaRevenueRecordRsp {
    int64 record_day = 1;
    int64 total_revenue = 2;
    int64 sold_cups = 4;
    repeated MilkTeaCupCount cups_by_recipe = 5;
    repeated corepb.Item rewards = 8;
}

message ActivityBodyHappyShare { HappyShareSummary summary = 1; }

message HappyShareSummary {
    int64 happy_value = 2;
    repeated HappyShareMilestone milestones = 5;
}

message HappyShareMilestone {
    int64 step_id = 1;
    int64 required_value = 2;
    repeated corepb.Item awards = 3;
    int64 status = 4; 
}

message HappySharePrepareRsp {
    bytes share_data = 1; 
    int64 happy_value_added = 2;
}

message HappyShareClaimRsp {
    repeated int64 claimed_step_ids = 1 [packed = true];
    repeated corepb.Item awards = 2;
}

message HappyShareDailyRsp { int64 happy_value_added = 2; }

message ActivityData {
    ActivityHead head = 1;
    oneof body {
        ActivityBodyShop shop = 102;
        ActivityBodyHappyShare happy_share = 120;
        ActivityBodyMilkTea milk_tea = 121;
    }
}
message ActivityGroup { ActivityHead head = 1; repeated ActivityData children = 2; }
message GetGroupRequest { int64 group_id = 1; }
message GetGroupReply { ActivityGroup group = 1; }
message OperateRequest {
    int64 id = 1;
    int64 cmd = 2;
    oneof req {
        ShopBuyReq shop_buy = 101;
        MilkTeaEmptyReq milk_tea_shop_view = 160;
        MilkTeaHireListReq milk_tea_hire_list = 161;
        MilkTeaHireReq milk_tea_hire = 162;
        MilkTeaEmptyReq milk_tea_recipes = 163;
        MilkTeaEmptyReq milk_tea_claim = 164;
        MilkTeaMakeReq milk_tea_make = 167;
        MilkTeaEmptyReq milk_tea_ranking = 171;
        MilkTeaEmptyReq milk_tea_revenue_record = 172;
    }
}
message OperateReply {
    int64 id = 1;
    int64 cmd = 2;
    ActivityData activity = 3;
    oneof rsp {
        ShopBuyRsp shop_buy = 101;
        HappySharePrepareRsp happy_share_prepare = 153;
        HappyShareClaimRsp happy_share_claim = 154;
        HappyShareDailyRsp happy_share_daily = 157;
        MilkTeaShopViewRsp milk_tea_shop_view = 160;
        MilkTeaHireListRsp milk_tea_hire_list = 161;
        MilkTeaHireRsp milk_tea_hire = 162;
        MilkTeaRecipesRsp milk_tea_recipes = 163;
        MilkTeaClaimRsp milk_tea_claim = 164;
        MilkTeaMakeRsp milk_tea_make = 167;
        MilkTeaRankingRsp milk_tea_ranking = 171;
        MilkTeaRevenueRecordRsp milk_tea_revenue_record = 172;
    }
}
